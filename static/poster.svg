<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ZIA Natural Soap Collection</title>
  <desc id="desc">Brand poster for ZIA Natural Soap Collection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffef2"/>
      <stop offset="100%" stop-color="#edf4df"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0%" stop-color="#f4efd0"/>
      <stop offset="100%" stop-color="#dfeed2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="170" fill="#dfeec6" opacity="0.45"/>
  <circle cx="180" cy="680" r="210" fill="#f2e8b2" opacity="0.35"/>
  <g transform="translate(120 120)">
    <rect x="0" y="0" width="960" height="560" rx="32" fill="#fff" opacity="0.66"/>
    <g transform="translate(70 80)">
      <rect x="0" y="0" width="240" height="240" rx="32" fill="url(#card)"/>
      <text x="120" y="120" text-anchor="middle" font-size="88">🌿</text>
      <text x="120" y="180" text-anchor="middle" font-size="28" font-weight="700" fill="#0d5c2b">ZIA</text>
      <text x="120" y="210" text-anchor="middle" font-size="18" letter-spacing="3" fill="#0d5c2b">SOAP</text>
    </g>
    <g transform="translate(370 90)">
      <text x="0" y="70" font-size="90" font-weight="900" fill="#0d5c2b" font-family="Arial, sans-serif">ZIA</text>
      <text x="0" y="150" font-size="34" letter-spacing="8" font-weight="700" fill="#263b2d" font-family="Arial, sans-serif">NATURAL SOAP</text>
      <text x="0" y="215" font-size="28" fill="#4a6d56" font-family="Arial, sans-serif">Handmade care for your daily ritual</text>
      <rect x="0" y="250" width="250" height="64" rx="16" fill="#0d5c2b"/>
      <text x="125" y="290" text-anchor="middle" font-size="24" font-weight="700" fill="#fff" font-family="Arial, sans-serif">₹120 ONLY</text>
    </g>
    <g transform="translate(690 90)">
      <rect x="0" y="0" width="200" height="200" rx="28" fill="#e7f0d4"/>
      <text x="100" y="95" text-anchor="middle" font-size="74">🧼</text>
      <text x="100" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#0d5c2b">NATURAL</text>
      <text x="100" y="170" text-anchor="middle" font-size="18" fill="#0d5c2b">SOAP BAR</text>
    </g>
  </g>
</svg>
